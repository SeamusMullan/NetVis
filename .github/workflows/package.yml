# Reusable build+package workflow: builds NetVis Release on all three OSes and
# produces the platform installer (NSIS .exe on Windows, .dmg on macOS, .zip on
# Linux), the standalone netvis_mcp binary per platform, and one SHA256SUMS
# covering everything. Called by ci.yml (on a vX.Y.Z tag) and
# release-override.yml (manual override). Uploads each artifact so the caller
# can attach them to a GitHub Release.
name: package

on:
  workflow_call:
    inputs:
      version:
        description: "Version string X.Y.Z stamped into the package metadata"
        required: true
        type: string

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: the binaries link against the builder's
          # glibc, so building on the oldest supported LTS keeps the published
          # netvis_mcp runnable on 22.04-era distros. Built on 24.04 it demands
          # GLIBC_2.38/GLIBCXX_3.4.32 and dies on anything older.
          - os: ubuntu-22.04
            gen: ZIP
            ext: zip
            label: Linux-x86_64
            exe: ""
          - os: macos-latest
            gen: DragNDrop
            ext: dmg
            label: macOS-arm64
            exe: ""
          - os: windows-latest
            gen: NSIS
            ext: exe
            label: Windows-x64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Linux GUI build needs OpenGL + X11 dev headers for GLFW.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev

      # NSIS provides makensis for the Windows installer generator. choco EXITS 0
      # when the community feed 503s ("Chocolatey installed 0/0 packages"), so a
      # bare `choco install` goes green and the run instead dies five minutes
      # later in cpack with a misleading "Cannot find NSIS compiler makensis".
      # Retry the flaky feed, then assert makensis really is there so a failed
      # install fails HERE, at the step that owns it.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          foreach ($i in 1..3) {
            if (Test-Path "$nsis\makensis.exe") { break }
            if ($i -gt 1) { Start-Sleep -Seconds 15 }
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path "$nsis\makensis.exe")) {
            throw "NSIS install failed: no makensis.exe under $nsis"
          }
          "$nsis" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNETVIS_VERSION=${{ inputs.version }}
          -DNETVIS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.gen }} --verbose

      # Collect the CPack output and rename it to a CANONICAL name. CPack's NSIS
      # generator ignores CPACK_PACKAGE_FILE_NAME and names the .exe using only
      # the major version (e.g. "NetVis-0-..."), so we rename by extension here
      # rather than trusting the generator's filename.
      - name: Collect artifact
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          src=(NetVis-*.${{ matrix.ext }})
          if [ ${#src[@]} -ne 1 ]; then
            echo "::error::expected exactly one .${{ matrix.ext }}, found: ${src[*]:-none}"
            exit 1
          fi
          dest="NetVis-${{ inputs.version }}-${{ matrix.label }}.${{ matrix.ext }}"
          cp "${src[0]}" "dist/$dest"
          echo "Packaged: $dest"; ls -la dist

      # The standalone MCP server binary, published bare (no archive) so a
      # downloader (the Claude Code plugin bootstrap, a script, plain curl)
      # needs zero extraction tooling. The installers stay the way to get the
      # full app; this asset exists for headless and agent installs.
      - name: Collect the MCP server binary
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          bin="netvis_mcp${{ matrix.exe }}"
          if [ ! -f "$bin" ]; then
            echo "::error::$bin missing from the build tree"
            exit 1
          fi
          dest="netvis_mcp-${{ inputs.version }}-${{ matrix.label }}${{ matrix.exe }}"
          cp "$bin" "dist/$dest"
          echo "Packaged: $dest"; ls -la dist

      # Validate the artifact so a broken/empty package FAILS the job instead of
      # being silently published. Guards against past bugs: an empty macOS .pkg
      # (missing bundle payload) and a mis-versioned filename.
      - name: Validate artifact
        shell: bash
        working-directory: build/dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(NetVis-* netvis_mcp-*)
          if [ ${#files[@]} -lt 2 ]; then
            echo "::error::expected an installer and a bare binary, found: ${files[*]:-none}"
            exit 1
          fi
          for f in "${files[@]}"; do
            size=$(wc -c < "$f")
            echo "artifact $f = $size bytes"
            # Every real installer or binary is well over 100 KB; a tiny file
            # means an empty payload (e.g. a bundle that never got installed).
            if [ "$size" -lt 102400 ]; then
              echo "::error::artifact $f is only $size bytes — likely empty/broken"
              exit 1
            fi
            # The version must appear in the filename (catches the "-0-" bug).
            case "$f" in
              *"${{ inputs.version }}"*) ;;
              *) echo "::error::artifact $f is missing version ${{ inputs.version }}"; exit 1 ;;
            esac
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netvis-${{ runner.os }}
          path: build/dist/*
          if-no-files-found: error

  # One SHA256SUMS covering every published file, generated in a follow-up job
  # so the sums from all three OS jobs land in a single file. Downloaders of
  # the bare binary verify against this before first run. The artifact name
  # keeps the netvis- prefix so the callers' release jobs sweep it up exactly
  # like the installers.
  checksums:
    name: checksums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download every packaged artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: netvis-*
          merge-multiple: true
      # Explicit globs, not *: if either pattern matches nothing, sha256sum
      # fails on the literal string, so a missing asset class breaks the build
      # here instead of shipping an incomplete SHA256SUMS.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum NetVis-* netvis_mcp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: netvis-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
