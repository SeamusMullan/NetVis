# Main CI: sanitizers (ASan+UBSan, TSan) and a headless build+test on every
# push/PR. On a vX.Y.Z tag it additionally builds the per-OS installers and
# publishes them to a GitHub Release.
name: ci

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # e.g. v1.2.0 — drives the release
  pull_request:
    branches: [master]

permissions:
  contents: write   # needed by the release job to create/attach to a Release

jobs:
  # --- Correctness: run the test suite under each sanitizer -------------------
  sanitizers:
    name: sanitizer (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'address' also enables UBSan (they combine); 'thread' runs alone.
        san: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: >
          cmake -B build/san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNETVIS_BUILD_APP=OFF
          -DNETVIS_SANITIZER=${{ matrix.san }}
      - name: Build tests
        run: cmake --build build/san --target netvis_tests
      - name: Run tests under sanitizer
        working-directory: ${{ github.workspace }}
        env:
          # Fail the job on the first sanitizer report; ignore benign leaks.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/san/netvis_tests

  # Dedicated UBSan-only job (address already bundles UBSan, but this proves the
  # standalone undefined preset also builds/passes).
  ubsan:
    name: sanitizer (undefined)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: >
          cmake -B build/ubsan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DNETVIS_BUILD_APP=OFF -DNETVIS_SANITIZER=undefined
      - run: cmake --build build/ubsan --target netvis_tests
      - env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/ubsan/netvis_tests

  # --- Plain headless build + ctest (fast gate, no instrumentation) -----------
  build-test:
    name: build + ctest (core-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: cmake --preset core-only
      - run: cmake --build --preset core-only
      - run: ctest --preset core-only

  # --- Performance-regression gate (#97) ---------------------------------------
  # Compares a fresh `netvis --bench` run against the committed bench/baseline.json
  # via tools/bench_gate.py. Runs on every push/PR (not tag-only) so a regression
  # is caught at review time, not discovered after a release ships.
  perf-gate:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      # `netvis --bench` (src/main.cpp) is only compiled into the `netvis` GUI
      # target -- it is NOT part of netvis_core or netvis_tests (see
      # CMakeLists.txt: NETVIS_VIEW_SRC + main.cpp only exist inside the
      # `if(NETVIS_BUILD_APP)` block). Getting a headless benchmark therefore
      # still means LINKING the full GLFW/OpenGL/Dear ImGui/tinyfiledialogs
      # chain, even though --bench exits before a window or GL context is ever
      # created. Same package list package.yml's Linux job installs for the
      # same reason (GLFW needs the X11/GL dev headers to build).
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev
      # Release, not Debug and not sanitized: bench/baseline.json (once
      # committed) is a Release measurement, and tools/bench_gate.py refuses to
      # compare across build types on purpose (a Debug number is a different
      # measurement, not a slower one). NETVIS_BUILD_TESTS=OFF skips compiling
      # netvis_tests, which this job never runs, to keep the build fast.
      - name: Configure (Release)
        run: >
          cmake -B build/perf -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNETVIS_BUILD_TESTS=OFF
      - name: Build netvis
        run: cmake --build build/perf --target netvis
      # --bench-quick skips the 100k-node rung (BenchOptions::quick in
      # engine/Bench.h). The full ladder's 100k rung at median-of-5 is the
      # right thing to run before a release, but on every push/PR the fast
      # 1k/10k signal is enough to catch a real regression without eating a
      # shared runner's time budget -- this job should stay fast enough that
      # nobody is tempted to skip waiting for it.
      - name: Run benchmark (quick ladder)
        run: ./build/perf/netvis --bench-quick > bench-current.json
      - name: Upload bench result
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-current.json
          if-no-files-found: error
      # bench/baseline.json does not exist until a maintainer generates the
      # first REAL baseline from this harness (see bench/README.md — a
      # baseline committed before the harness could ever run would be
      # fabricated data). Until then, treat "no baseline" as report-only: warn
      # loudly so the gap is visible in every run's log, upload the JSON so
      # the numbers are there when it is time to pick a baseline, but do NOT
      # fail the build over a file nobody could have committed yet.
      - name: Check for committed baseline
        id: baseline
        run: |
          if [ -f bench/baseline.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::bench/baseline.json is not committed yet -- perf gate is running in report-only mode (see bench/README.md). It will start enforcing once a maintainer commits a real baseline."
          fi
      - name: Compare against baseline
        if: steps.baseline.outputs.present == 'true'
        run: python3 tools/bench_gate.py --baseline bench/baseline.json --current bench-current.json

  # --- Derive the version from the tag (only on a vX.Y.Z tag) -----------------
  version:
    name: resolve version
    needs: [sanitizers, ubsan, build-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        # Strip the leading "v" from refs/tags/vX.Y.Z.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # --- Build the installers for all OSes (reusable workflow) ------------------
  package:
    name: package
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # --- Publish the GitHub Release with the installers attached ----------------
  release:
    name: publish release
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create / update the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetVis ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          # Force a FULL, latest release. Without these, if a release object for
          # this tag already exists as a draft/pre-release (e.g. a prior
          # release-override validation run reused the version number), the action
          # UPDATES it without clearing the flag — so the tag release wrongly stays
          # pre-release. Explicit flags make the tag publish authoritative.
          prerelease: false
          draft: false
          make_latest: true
