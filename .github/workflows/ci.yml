# SPDX-License-Identifier: Apache-2.0
# Main CI: sanitizers (ASan+UBSan, TSan) and a headless build+test on every
# push/PR. On a vX.Y.Z tag it additionally builds the per-OS installers and
# publishes them to a GitHub Release.
name: ci

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # e.g. v1.2.0 — drives the release
  pull_request:
    branches: [master]

permissions:
  contents: write   # needed by the release job to create/attach to a Release

jobs:
  # --- Correctness: run the test suite under each sanitizer -------------------
  sanitizers:
    name: sanitizer (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'address' also enables UBSan (they combine); 'thread' runs alone.
        san: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: >
          cmake -B build/san -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNETVIS_BUILD_APP=OFF
          -DNETVIS_SANITIZER=${{ matrix.san }}
      - name: Build tests
        run: cmake --build build/san --target netvis_tests
      - name: Run tests under sanitizer
        working-directory: ${{ github.workspace }}
        env:
          # Fail the job on the first sanitizer report; ignore benign leaks.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/san/netvis_tests

  # Dedicated UBSan-only job (address already bundles UBSan, but this proves the
  # standalone undefined preset also builds/passes).
  ubsan:
    name: sanitizer (undefined)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: >
          cmake -B build/ubsan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DNETVIS_BUILD_APP=OFF -DNETVIS_SANITIZER=undefined
      - run: cmake --build build/ubsan --target netvis_tests
      - env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/ubsan/netvis_tests

  # --- Plain headless build + ctest (fast gate, no instrumentation) -----------
  build-test:
    name: build + ctest (core-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: cmake --preset core-only
      - run: cmake --build --preset core-only
      - run: ctest --preset core-only

  # --- Performance-regression gate (#97) ---------------------------------------
  # Compares a fresh `netvis --bench` run against the committed bench/baseline.json
  # via tools/bench_gate.py. Runs on every push/PR (not tag-only) so a regression
  # is caught at review time, not discovered after a release ships.
  perf-gate:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      # netvis_bench links netvis_core ONLY (CMakeLists.txt) -- no GLFW, no
      # OpenGL, no ImGui, and therefore no X11/GL dev packages to install. The
      # --bench flags also exist on the GUI binary for local convenience, but
      # building the whole graphics stack on every push to run a benchmark that
      # never opens a window would cost minutes per run for nothing.
      #
      # Release, not Debug and not sanitized: bench/baseline.json is a Release
      # measurement and tools/bench_gate.py refuses to compare across build
      # types on purpose (a Debug number is a different measurement, not a
      # slower one). NETVIS_BUILD_TESTS=OFF skips netvis_tests, which the
      # build-test job already covers.
      - name: Configure (Release)
        run: >
          cmake -B build/perf -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNETVIS_BUILD_TESTS=OFF
          -DNETVIS_BUILD_APP=OFF
      - name: Build netvis_bench
        run: cmake --build build/perf --target netvis_bench
      # The FULL ladder, including the 100k rung. An earlier version ran
      # --bench-quick to save runner time, which left the 100k rung ungated --
      # and 100k is the whole point, since it is the only rung where a
      # superlinear regression is visible at all (the O(initializers x values)
      # loop #97 found cost 0.28 ms at 1k and 6.4 SECONDS at 100k). Measured at
      # roughly two seconds on this runner, which is not worth trading the only
      # rung that can catch that class of bug.
      #
      # Runs on WHATEVER hardware the runner turns out to be, with no skip
      # condition (#154). `ubuntu-latest` hands out 2- and 4-core machines
      # interchangeably, and a run that cannot be compared is still a run worth
      # having: the JSON below is the only record of what this branch measured,
      # and it is what a maintainer reads when choosing the next baseline.
      # Skipping the benchmark on an unexpected machine would throw that away
      # to avoid a comparison that the next step already declines to make.
      - name: Run benchmark (full ladder)
        run: ./build/perf/netvis_bench --bench > bench-current.json
      # Unconditional, and BEFORE the comparison on purpose: the numbers must
      # survive whatever verdict the gate reaches, including a failing one. An
      # upload placed after a failing gate step would never run, so the one run
      # a human most needs to inspect would be the one with no artifact.
      - name: Upload bench result
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-current.json
          if-no-files-found: error
      # bench/baseline.json exists only once a maintainer has generated a REAL
      # baseline from this harness (see bench/README.md — a baseline written
      # before the harness could ever run would be fabricated data). One is
      # committed today, but this path is not dead: every kBenchSchema bump
      # strands it again. When there is no usable baseline, report-only: warn
      # loudly so the gap is visible in every run's log, upload the JSON so
      # the numbers are there when it is time to pick a baseline, but do NOT
      # fail the build over a file nobody could have committed yet.
      - name: Check for committed baseline
        id: baseline
        run: |
          if [ -f bench/baseline.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::bench/baseline.json is not committed yet -- perf gate is running in report-only mode (see bench/README.md). It will start enforcing once a maintainer commits a real baseline."
          fi
      # tools/bench_gate.py answers with THREE outcomes, and this step is what
      # makes the third one mean anything (#154):
      #
      #   0 -> the code is within threshold. Pass.
      #   1 -> a real regression, or a stage that vanished. FAIL — this is the
      #        gate. It is the only reason the job exists.
      #   2 -> "cannot judge": the two runs are not the same measurement
      #        (different schema, build type, or machine class), so no verdict
      #        about the code exists. Warn, and pass.
      #
      # Running the script bare made 2 fail exactly like 1. Runner allocation
      # on ubuntu-latest is not stable — #148 landed on a 2-core machine
      # against a 4-core baseline (#121) — so the gate went red on every pull
      # request while measuring nothing, which is how a gate gets ignored.
      #
      # The `case` matches the literal 2 and nothing else: every other non-zero
      # status, including a regression (1), an argument error, or a python
      # crash (2 is a chosen exit code, 137 is not), falls to `*` and re-exits
      # with it. A `continue-on-error: true` or a trailing `|| true` here would
      # be far shorter and would silently swallow exit 1 as well, leaving a job
      # that reports a green perf gate for a genuine regression.
      #
      # `|| status=$?` rather than `set +e`: the step's shell is `bash -e`, and
      # a bare failing command would abort the step before the case is ever
      # reached. The left side of `||` is exempt from -e, so the exit code
      # reaches the dispatch below intact.
      - name: Compare against baseline
        if: steps.baseline.outputs.present == 'true'
        run: |
          status=0
          python3 tools/bench_gate.py \
            --baseline bench/baseline.json \
            --current bench-current.json || status=$?
          case "$status" in
            0)
              echo "perf gate: PASS"
              ;;
            2)
              echo "::warning::perf gate could not judge this run (bench_gate exit 2): the baseline and this run are not the same measurement -- see the log above for both machines, and bench/README.md for re-baselining. No regression was detected and none was ruled out."
              ;;
            *)
              echo "::error::perf gate FAILED (bench_gate exit $status): see the REGRESSION/MISSING rows above."
              exit "$status"
              ;;
          esac

  # --- Derive the version from the tag (only on a vX.Y.Z tag) -----------------
  version:
    name: resolve version
    needs: [sanitizers, ubsan, build-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        # Strip the leading "v" from refs/tags/vX.Y.Z.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # --- Build the installers for all OSes (reusable workflow) ------------------
  package:
    name: package
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # --- Publish the GitHub Release with the installers attached ----------------
  release:
    name: publish release
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Only the per-OS installers. `merge-multiple` with no pattern downloads
      # EVERY artifact any job in the run uploaded, which silently swept the perf
      # gate's bench-current.json into the v0.9.3 release as a published asset.
      # A release should contain exactly what a user installs, so the pattern is
      # explicit and a new diagnostic artifact cannot leak into a release again.
      - name: Download the packaged installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: netvis-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create / update the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetVis ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          # Force a FULL, latest release. Without these, if a release object for
          # this tag already exists as a draft/pre-release (e.g. a prior
          # release-override validation run reused the version number), the action
          # UPDATES it without clearing the flag — so the tag release wrongly stays
          # pre-release. Explicit flags make the tag publish authoritative.
          prerelease: false
          draft: false
          make_latest: true
